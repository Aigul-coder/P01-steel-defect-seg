[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steel-defect-seg"
version = "0.1.0"
description = "Severstal steel defect segmentation — UNet baseline vs imbalance-aware model"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CV Portfolio" }]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.8,<5",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "albumentations>=1.4,<2",
  "segmentation-models-pytorch>=0.3.4,<0.5",
  "timm>=0.9,<2",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "onnx>=1.15,<2",
  "onnxscript>=0.1.0",
  "onnxruntime>=1.17,<2",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "huggingface-hub>=0.20,<1",
  "pandas>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "ruff>=0.4,<1",
]
train = [
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.scripts]
steel-defect-api = "steel_defect.api:main"
steel-defect-predict = "steel_defect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: longer training/smoke runs",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
