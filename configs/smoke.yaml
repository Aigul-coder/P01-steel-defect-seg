# Short smoke config for local DoD (synthetic data)
experiment_name: smoke_improved
seed: 42
device: cuda
amp: true

data:
  root: data/subset
  csv: train.csv
  images_dir: train_images
  image_size: 128
  val_frac: 0.25
  num_workers: 0

model:
  architecture: unet
  encoder: resnet18
  encoder_weights: null
  num_classes: 4

train:
  mode: improved
  epochs: 2
  batch_size: 4
  lr: 1.0e-3
  weight_decay: 1.0e-4
  class_weights: [1.5, 3.0, 1.0, 1.2]
  focal_gamma: 2.0
  dice_weight: 0.6
  bce_weight: 0.4
  log_every: 1

eval:
  threshold: 0.5

export:
  onnx_path: artifacts/model.onnx
  opset: 17

artifacts:
  dir: artifacts
  weights: artifacts/model.pt
  metrics: artifacts/metrics.json
