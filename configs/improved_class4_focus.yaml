experiment_name: improved_unet_resnet34_focal_class4focus
seed: 42
device: cuda
amp: true

data:
  root: data/raw
  csv: train.csv
  images_dir: train_images
  image_size: 256
  val_frac: 0.2
  holdout_ids: data/holdout_ids.txt
  num_workers: 0

model:
  architecture: unet
  encoder: resnet34
  encoder_weights: imagenet
  num_classes: 4

train:
  mode: improved
  epochs: 8
  batch_size: 8
  lr: 8.0e-4
  weight_decay: 1.0e-4
  # Strongly increase class 4 pos_weight to improve recall on yellow class.
  class_weights: [1.5, 3.0, 1.0, 8.0]
  # Oversample images that contain GT class 4 to improve recall on outliers.
  oversample_class_id: 4
  oversample_factor: 4
  focal_gamma: 2.0
  dice_weight: 0.65
  bce_weight: 0.35
  log_every: 10

eval:
  threshold: 0.5

export:
  onnx_path: artifacts/model_class4_focus.onnx
  opset: 17

artifacts:
  dir: artifacts
  weights: artifacts/model_class4_focus.pt
  metrics: artifacts/metrics_class4_focus.json

