# Improved: UNet + focal BCE + class weights for imbalance
experiment_name: improved_unet_resnet34_focal
seed: 42
device: cuda
amp: true

data:
  root: data/raw
  csv: train.csv
  images_dir: train_images
  image_size: 256
  val_frac: 0.2
  holdout_ids: data/holdout_ids.txt
  num_workers: 0

model:
  architecture: unet
  encoder: resnet34
  encoder_weights: imagenet
  num_classes: 4

train:
  mode: improved
  epochs: 8
  batch_size: 8
  lr: 8.0e-4
  weight_decay: 1.0e-4
  # Higher weight on rare classes (class 2 is typically scarcest on Severstal)
  class_weights: [1.5, 3.0, 1.0, 1.2]
  focal_gamma: 2.0
  dice_weight: 0.6
  bce_weight: 0.4
  log_every: 10

eval:
  threshold: 0.5

export:
  onnx_path: artifacts/model.onnx
  opset: 17

artifacts:
  dir: artifacts
  weights: artifacts/model.pt
  metrics: artifacts/metrics.json
